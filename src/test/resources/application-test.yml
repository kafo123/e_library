spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 独立测试库 e_library_test,避免污染开发库;可用环境变量覆盖连接信息
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/e_library_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: always
      encoding: UTF-8
  data:
    redis:
      host: localhost
      # port 由 EmbeddedRedisTestBase 的 @DynamicPropertySource 注入(内嵌真实 redis-server 进程)
